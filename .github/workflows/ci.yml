name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'investigate/**'

jobs:
  harness:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Run CI checks
        run: zsh scripts/harness.sh ci

  package-verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Build and package
        env:
          OPEN_ISLAND_BUNDLE_ID: app.openisland.OpenIsland
          OPEN_ISLAND_VERSION: 1.3.2
          OPEN_ISLAND_BUILD_NUMBER: 85
        run: zsh scripts/package-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OpenIsland-codex-terminal-discovery
          path: output/package/Open Island.zip
          retention-days: 7

      # Bundle structure is verified inside package-app.sh itself.
      # No separate verify step needed — the script exits non-zero on
      # missing files.
